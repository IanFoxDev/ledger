name: php

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: php ${{ matrix.php }}${{ matrix.dependencies == 'lowest' && ', lowest' || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4", "8.5"]
        dependencies: ["highest"]
        include:
          # brick/math 0.12, PHPStan 2.1 and PHPUnit 12.5, the oldest versions composer.json allows.
          - php: "8.3"
            dependencies: lowest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer update --no-progress ${{ matrix.dependencies == 'lowest' && '--prefer-lowest' || '' }}
      - run: vendor/bin/phpunit
      - run: vendor/bin/phpstan analyse --no-progress
        if: matrix.dependencies == 'highest'

  cs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
      - run: composer update --no-progress
      - run: vendor/bin/php-cs-fixer check --diff
