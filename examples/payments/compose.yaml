# docker compose up -d --build --wait
# docker compose exec app vendor/bin/phpunit
# docker compose exec app php bin/provider-report.php
# docker compose run --rm recon
# docker compose run --rm money-checks
name: ledger-payments

services:
  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_USER: shop, POSTGRES_PASSWORD: shop, POSTGRES_DB: shop }
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "shop"]
      interval: 1s
      retries: 30

  psp:
    image: ${PSP_SANDBOX_IMAGE:-ghcr.io/ianfoxdev/psp-sandbox:1}
    ports: ["8090:8090"] # web UI at http://localhost:8090/_sandbox/
    environment:
      PSP_CALLBACK_URL: http://app:8000/psp/callback
      PSP_WEBHOOK_SECRET: whsec_dGVzdC1zZWNyZXQ=
      PSP_SCENARIOS_FILE: /etc/psp-sandbox/scenarios.yaml
      # A failed callback comes back twice, a second apart, then the delivery is failed.
      PSP_RETRY_SCHEDULE: 0s,1s,1s
    volumes:
      - ./scenarios.yaml:/etc/psp-sandbox/scenarios.yaml:ro

  app:
    build: .
    # The whole repository is mounted: composer.json takes the ledger from ../..
    volumes: ["../..:/src"]
    working_dir: /src/examples/payments
    environment:
      DATABASE_DSN: pgsql:host=postgres;dbname=shop;user=shop;password=shop
      PSP_URL: http://psp:8090
      PSP_WEBHOOK_SECRET: whsec_dGVzdC1zZWNyZXQ=
    command: >
      sh -c "composer install --no-progress --no-interaction
      && php bin/schema.php
      && frankenphp php-server --listen :8000 --root public"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 8000) ? 0 : 1);"]
      interval: 2s
      start_period: 120s
      retries: 60
    depends_on:
      postgres: { condition: service_healthy }
      psp: { condition: service_healthy }

  # Not started by "up": run it after the provider's report is downloaded.
  recon:
    image: ghcr.io/ianfoxdev/recon:0.2
    profiles: [recon]
    # The app container writes exports/ as root; recon writes out/ next to it.
    user: "0:0"
    working_dir: /work
    command: ["run", "-c", "/work/recon.yaml"]
    environment:
      LEDGER_DSN: postgres://shop:shop@postgres:5432/shop
    volumes: ["./:/work"]
    depends_on:
      postgres: { condition: service_healthy }

  # Not started by "up": the ledger's invariants, read from the tables.
  money-checks:
    image: ghcr.io/ianfoxdev/money-checks:0.8
    profiles: [checks]
    command: ["run", "-c", "/checks/checks.yaml"]
    environment:
      LEDGER_PG_DSN: postgres://shop:shop@postgres:5432/shop
    volumes: ["./checks:/checks:ro"]
    depends_on:
      postgres: { condition: service_healthy }
